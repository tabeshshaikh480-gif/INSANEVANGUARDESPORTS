<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 900">

  <defs>

    <!-- Gold gradient -->
    <linearGradient id="gold"
      x1="0%" y1="0%"
      x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b3500"/>
      <stop offset="35%" stop-color="#ffd45a"/>
      <stop offset="60%" stop-color="#9a6100"/>
      <stop offset="100%" stop-color="#ffe08a"/>
    </linearGradient>

    <!-- Silver gradient -->
    <linearGradient id="metal"
      x1="0%" y1="0%"
      x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#bfc0c2"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7d7d7"/>
    </linearGradient>

    <!-- Gold glow -->
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-opacity=".7"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="800"
        height="900"
        rx="30"
        fill="#030303"/>

  <!-- GOLD GLOW CURVES -->

  <path d="
    M-80 180
    C120 40 250 260 410 170
    C560 80 650 130 880 20"
    fill="none"
    stroke="url(#gold)"
    stroke-width="35"
    opacity=".7"
    filter="url(#goldGlow)"/>

  <path d="
    M-100 500
    C120 300 250 520 430 430
    C610 340 700 420 900 270"
    fill="none"
    stroke="url(#gold)"
    stroke-width="35"
    opacity=".65"
    filter="url(#goldGlow)"/>

  <path d="
    M-50 720
    C180 500 300 720 500 610
    C650 530 730 650 900 510"
    fill="none"
    stroke="url(#gold)"
    stroke-width="35"
    opacity=".65"
    filter="url(#goldGlow)"/>

  <!-- SHARP GOLD ACCENTS -->

  <path d="
    M55 180
    L180 90
    L300 150"
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    opacity=".9"/>

  <path d="
    M500 750
    L650 650
    L770 690"
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    opacity=".9"/>

  <!-- MAIN ESPORTS SYMBOL -->

  <g filter="url(#shadow)"
     fill="url(#metal)"
     stroke="#ffffff"
     stroke-width="6"
     stroke-linejoin="miter">

    <!-- LEFT VERTICAL -->

    <path d="
      M105 220
      L145 250
      L145 590
      L105 590
      Z"/>

    <!-- V SHAPE -->

    <path d="
      M145 250
      L205 250
      L335 475
      L475 250
      L535 250
      L335 590
      Z"/>

    <!-- TOP RIGHT F -->

    <path d="
      M475 250
      L680 250
      L640 300
      L535 300
      L510 345
      L620 345
      L580 395
      L480 395
      L445 455
      L390 455
      Z"/>

    <!-- RIGHT VERTICAL -->

    <path d="
      M535 395
      L595 395
      L595 590
      L535 590
      Z"/>

  </g>

  <!-- INNER GOLD V -->

  <path d="
    M230 300
    L335 480
    L445 300"
    fill="none"
    stroke="url(#gold)"
    stroke-width="9"
    opacity=".9"/>

  <!-- SMALL GOLD DETAILS -->

  <path d="
    M115 630
    L190 630"
    stroke="url(#gold)"
    stroke-width="6"/>

  <path d="
    M480 630
    L555 630"
    stroke="url(#gold)"
    stroke-width="6"/>

  <!-- BRAND NAME -->

  <text x="400"
        y="705"
        text-anchor="middle"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="900"
        letter-spacing="8">
    INSANEVANGUARD
  </text>

  <!-- ESPORTS LABEL -->

  <text x="400"
        y="755"
        text-anchor="middle"
        fill="url(#gold)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="7">
    ESPORTS
  </text>

  <!-- Bottom line -->

  <line x1="170"
        y1="785"
        x2="630"
        y2="785"
        stroke="url(#gold)"
        stroke-width="4"/>

  <!-- Decorative diamonds -->

  <polygon points="145,785 155,775 165,785 155,795"
           fill="#ffd45a"/>

  <polygon points="635,785 645,775 655,785 645,795"
           fill="#ffd45a"/>

</svg>